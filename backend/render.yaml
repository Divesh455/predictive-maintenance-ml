# backend/render.yaml
# ─────────────────────────────────────────────
# Render Blueprint — drop this file in repo root
# and Render auto-configures the Web Service.
#
# Usage: render.com → New → Blueprint → connect repo

services:
  - type: web
    name: predictive-maintenance-api
    env: python
    region: singapore          # change to your preferred region
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Uncomment and set after creating a Render PostgreSQL database:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: predictive-maintenance-db
      #     property: connectionString
